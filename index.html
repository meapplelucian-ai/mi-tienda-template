  <script>
    fetch('productos.json')
      .then(response => response.json())
      .then(data => {
        const contenedor = document.getElementById('contenedor-productos');
        contenedor.innerHTML = '';

        // Detecta automáticamente si los productos están directos o dentro de una propiedad
        const listaProductos = Array.isArray(data) ? data : (data.productos || data.items || []);

        if (listaProductos.length === 0) {
          contenedor.innerHTML = '<p>No hay productos disponibles por el momento.</p>';
          return;
        }

        listaProductos.forEach(producto => {
          const tarjeta = document.createElement('div');
          tarjeta.className = 'tarjeta-producto';

          let tuNumeroWhatsApp = "56922110348"; 
          let mensajeWhatsApp = encodeURIComponent("¡Hola! Quiero un/a " + producto.nombre + " por favor. ¿Te va quedando stock?");

          tarjeta.innerHTML = `
            <h3>${producto.nombre}</h3>
            <p class="precio">$${producto.precio} CLP</p>
            <p class="stock">Stock disponible: <strong>${producto.stock}</strong></p>
            <a href="https://wa.me/${tuNumeroWhatsApp}?text=${mensajeWhatsApp}" target="_blank" class="btn-comprar">Comprar Ahora</a>
          `;

          contenedor.appendChild(tarjeta);
        });
      })
      .catch(error => {
        console.error("Error al cargar los productos:", error);
      });
  </script>
