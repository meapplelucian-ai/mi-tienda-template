<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tienda</title>
  <link rel="stylesheet" href="estilos.css">
  <!-- Script para la autenticación del panel -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <h1>Nuestros Productos</h1>
  <div id="contenedor-productos" class="grid-productos"></div>

  <script>
    // Carga automática de los datos que modifique el cliente
    fetch('productos.json')
    .then(res => res.json())
    .then(data => {
      const contenedor = document.getElementById('contenedor-productos');
      data.productos.forEach(prod => {
        // Si no hay stock, deshabilita el botón
        const agotado = prod.stock <= 0;

        // Tu número de WhatsApp y mensaje automático tomando el nombre del producto
        const tuNumeroWhatsApp = "56922110348";
        const mensajeWhatsApp = encodeURIComponent("¡Hola! Quiero un/a " + prod.nombre + " por favor. ¿Te va quedando stock?");
        const linkWhatsApp = `https://wa.me/${tuNumeroWhatsApp}?text=${mensajeWhatsApp}`;

        contenedor.innerHTML += `
          <div class="tarjeta">
            <img src="${prod.imagen}" alt="${prod.nombre}">
            <h3>${prod.nombre}</h3>
            <p class="precio">$${prod.precio} CLP</p>
            <p>Stock disponible: ${prod.stock}</p>
            <a href="${agotado ? '#' : linkWhatsApp}" 
               class="btn ${agotado ? 'deshabilitado' : ''}" 
               target="_blank">
               ${agotado ? 'Agotado' : 'Comprar Ahora'}
            </a>
          </div>
        `;
      });
    });
  </script>

</body>
</html>
