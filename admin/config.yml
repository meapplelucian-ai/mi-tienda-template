backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "productos"
    label: "Productos"
    folder: "productos"
    create: true
    slug: "{{slug}}"

    fields:
      - {label: "ID", name: "id", widget: "string"}
      - {label: "Nombre", name: "nombre", widget: "string"}
      - {label: "Precio CLP", name: "precio", widget: "number"}
      - {label: "Stock", name: "stock", widget: "number"}
      - {label: "Imagen del Producto", name: "imagen", widget: "image"}
